# GREEN FAD — Audit ponctuel de la base de production (déclenché manuellement)
# Ne déploie rien : exécute des requêtes de diagnostic D1 et les affiche dans le log.
name: Audit base de données (lecture seule)

on:
  workflow_dispatch:

jobs:
  audit:
    name: Diagnostic doublons / contenus morts / médias orphelins
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installation des dépendances
        run: npm ci

      - name: 1) Comptage global
        run: npx wrangler d1 execute greenfad-production --remote --json --command "SELECT 'pages' t, COUNT(*) n FROM pages UNION ALL SELECT 'posts', COUNT(*) FROM posts UNION ALL SELECT 'products', COUNT(*) FROM products UNION ALL SELECT 'services', COUNT(*) FROM services UNION ALL SELECT 'faqs', COUNT(*) FROM faqs UNION ALL SELECT 'media', COUNT(*) FROM media UNION ALL SELECT 'media_albums', COUNT(*) FROM media_albums UNION ALL SELECT 'media_items', COUNT(*) FROM media_items UNION ALL SELECT 'page_versions', COUNT(*) FROM page_versions UNION ALL SELECT 'audit_log', COUNT(*) FROM audit_log UNION ALL SELECT 'projects', COUNT(*) FROM projects UNION ALL SELECT 'partners', COUNT(*) FROM partners UNION ALL SELECT 'menus', COUNT(*) FROM menus UNION ALL SELECT 'footer_sections', COUNT(*) FROM footer_sections UNION ALL SELECT 'settings', COUNT(*) FROM settings UNION ALL SELECT 'redirects', COUNT(*) FROM redirects UNION ALL SELECT 'newsletter_subscribers', COUNT(*) FROM newsletter_subscribers"

      - name: 2) Slugs en doublon
        run: npx wrangler d1 execute greenfad-production --remote --json --command "SELECT 'page' typ, slug v, COUNT(*) n FROM pages GROUP BY slug HAVING n>1 UNION ALL SELECT 'post', slug, COUNT(*) FROM posts GROUP BY slug HAVING n>1 UNION ALL SELECT 'product', slug, COUNT(*) FROM products GROUP BY slug HAVING n>1 UNION ALL SELECT 'service', slug, COUNT(*) FROM services GROUP BY slug HAVING n>1"

      - name: 3) Questions FAQ en doublon
        run: npx wrangler d1 execute greenfad-production --remote --json --command "SELECT question, COUNT(*) n, GROUP_CONCAT(id) ids FROM faqs GROUP BY question HAVING n>1 ORDER BY n DESC LIMIT 40"

      - name: 4) Articles morts (brouillons, vides)
        run: npx wrangler d1 execute greenfad-production --remote --json --command "SELECT id, slug, status, length(content_md) len, title FROM posts WHERE status <> 'publie' OR content_md IS NULL OR length(content_md) < 80 ORDER BY id"

      - name: 5) Produits/services non publiés
        run: npx wrangler d1 execute greenfad-production --remote --json --command "SELECT 'product' typ, id, name, status FROM products WHERE status <> 'publie' UNION ALL SELECT 'service', id, name, status FROM services WHERE status <> 'publie' ORDER BY typ, id"

      - name: 6) Médias en doublon (même nom)
        run: npx wrangler d1 execute greenfad-production --remote --json --command "SELECT filename, folder, COUNT(*) n, GROUP_CONCAT(id) ids, GROUP_CONCAT(r2_key, ' | ') keys FROM media GROUP BY filename, folder HAVING n>1 ORDER BY n DESC LIMIT 60"

      - name: 7) Médias orphelins (total)
        run: npx wrangler d1 execute greenfad-production --remote --json --command "SELECT COUNT(*) n, COALESCE(SUM(m.size),0) octets FROM media m WHERE NOT EXISTS (SELECT 1 FROM pages p WHERE instr(p.blocks, m.r2_key) > 0) AND NOT EXISTS (SELECT 1 FROM posts po WHERE instr(po.content_md, m.r2_key) > 0 OR instr(COALESCE(po.cover_key,''), m.r2_key) > 0 OR instr(COALESCE(po.meta_json,''), m.r2_key) > 0) AND NOT EXISTS (SELECT 1 FROM products pr WHERE instr(COALESCE(pr.blocks,''), m.r2_key) > 0 OR instr(COALESCE(pr.image_key,''), m.r2_key) > 0 OR instr(COALESCE(pr.og_image,''), m.r2_key) > 0 OR instr(COALESCE(pr.description_md,''), m.r2_key) > 0 OR instr(COALESCE(pr.features,''), m.r2_key) > 0) AND NOT EXISTS (SELECT 1 FROM services s WHERE instr(COALESCE(s.blocks,''), m.r2_key) > 0 OR instr(COALESCE(s.image_key,''), m.r2_key) > 0 OR instr(COALESCE(s.content_md,''), m.r2_key) > 0) AND NOT EXISTS (SELECT 1 FROM media_items mi WHERE mi.r2_key = m.r2_key) AND NOT EXISTS (SELECT 1 FROM media_albums al WHERE instr(COALESCE(al.cover_key,''), m.r2_key) > 0) AND NOT EXISTS (SELECT 1 FROM settings st WHERE instr(st.value, m.r2_key) > 0) AND NOT EXISTS (SELECT 1 FROM projects pj WHERE instr(COALESCE(pj.blocks,''), m.r2_key) > 0 OR instr(COALESCE(pj.image_key,''), m.r2_key) > 0) AND NOT EXISTS (SELECT 1 FROM footer_sections fs WHERE instr(COALESCE(fs.content,''), m.r2_key) > 0) AND NOT EXISTS (SELECT 1 FROM partners pt WHERE instr(COALESCE(pt.logo_key,''), m.r2_key) > 0) AND NOT EXISTS (SELECT 1 FROM jobs j WHERE instr(COALESCE(j.content_md,''), m.r2_key) > 0 OR instr(COALESCE(j.cover_key,''), m.r2_key) > 0) AND NOT EXISTS (SELECT 1 FROM documents d WHERE d.r2_key = m.r2_key)"

      - name: 8) Médias orphelins (liste, 200 premiers)
        run: npx wrangler d1 execute greenfad-production --remote --json --command "SELECT m.id, m.folder, m.filename, m.size FROM media m WHERE NOT EXISTS (SELECT 1 FROM pages p WHERE instr(p.blocks, m.r2_key) > 0) AND NOT EXISTS (SELECT 1 FROM posts po WHERE instr(po.content_md, m.r2_key) > 0 OR instr(COALESCE(po.cover_key,''), m.r2_key) > 0 OR instr(COALESCE(po.meta_json,''), m.r2_key) > 0) AND NOT EXISTS (SELECT 1 FROM products pr WHERE instr(COALESCE(pr.blocks,''), m.r2_key) > 0 OR instr(COALESCE(pr.image_key,''), m.r2_key) > 0 OR instr(COALESCE(pr.og_image,''), m.r2_key) > 0 OR instr(COALESCE(pr.description_md,''), m.r2_key) > 0 OR instr(COALESCE(pr.features,''), m.r2_key) > 0) AND NOT EXISTS (SELECT 1 FROM services s WHERE instr(COALESCE(s.blocks,''), m.r2_key) > 0 OR instr(COALESCE(s.image_key,''), m.r2_key) > 0 OR instr(COALESCE(s.content_md,''), m.r2_key) > 0) AND NOT EXISTS (SELECT 1 FROM media_items mi WHERE mi.r2_key = m.r2_key) AND NOT EXISTS (SELECT 1 FROM media_albums al WHERE instr(COALESCE(al.cover_key,''), m.r2_key) > 0) AND NOT EXISTS (SELECT 1 FROM settings st WHERE instr(st.value, m.r2_key) > 0) AND NOT EXISTS (SELECT 1 FROM projects pj WHERE instr(COALESCE(pj.blocks,''), m.r2_key) > 0 OR instr(COALESCE(pj.image_key,''), m.r2_key) > 0) AND NOT EXISTS (SELECT 1 FROM footer_sections fs WHERE instr(COALESCE(fs.content,''), m.r2_key) > 0) AND NOT EXISTS (SELECT 1 FROM partners pt WHERE instr(COALESCE(pt.logo_key,''), m.r2_key) > 0) AND NOT EXISTS (SELECT 1 FROM jobs j WHERE instr(COALESCE(j.content_md,''), m.r2_key) > 0 OR instr(COALESCE(j.cover_key,''), m.r2_key) > 0) AND NOT EXISTS (SELECT 1 FROM documents d WHERE d.r2_key = m.r2_key) ORDER BY m.folder, m.id LIMIT 200"

      - name: 9) Pages référençant /assets/images (liens statiques)
        run: npx wrangler d1 execute greenfad-production --remote --json --command "SELECT id, slug FROM pages WHERE blocks LIKE '%/assets/images/%' ORDER BY slug"

      - name: 10) Menus et pied de page
        run: npx wrangler d1 execute greenfad-production --remote --json --command "SELECT id, location, items FROM menus"

      - name: 11) Sections pied de page
        run: npx wrangler d1 execute greenfad-production --remote --json --command "SELECT id, section_key, title FROM footer_sections ORDER BY id"
