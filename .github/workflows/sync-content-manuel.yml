# GREEN FAD — Synchronisation MANUELLE du contenu éditorial (DESTRUCTIF)
#
# ⚠️ Ce workflow rejoue seed/content-update.sql sur la base de production :
#    il SUPPRIME le contenu éditorial actuel (galerie, articles, services,
#    produits, pages, menus, partenaires…) et le remplace par le contenu
#    semé du dépôt. Il a causé l incident du 10/11/2026.
#
# Il ne doit être lancé QUE si le fondateur souhaite volontairement réinitialiser
# le contenu éditorial depuis les seeds. La synchronisation automatique a été
# supprimée de deploy.yml et ne doit JAMAIS y être réintroduite.
#
# Sécurité : taper SYNCHRONISER dans le champ de confirmation pour autoriser
# l exécution. Toute autre valeur (ou champ vide) entraîne un refus.
name: Synchronisation manuelle du contenu (destructif)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Taper SYNCHRONISER pour confirmer la réinitialisation du contenu"
        required: true
        type: string

concurrency:
  group: greenfad-production
  cancel-in-progress: false

jobs:
  sync:
    name: Rejouer le seed éditorial (uniquement avec confirmation exacte)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - name: Vérification de la confirmation
        run: |
          if [ "${{ inputs.confirmation }}" != "SYNCHRONISER" ]; then
            echo "❌ Confirmation absente ou incorrecte — exécution refusée."
            exit 1
          fi
          echo "Confirmation reçue — exécution autorisée."

      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installation des dépendances
        run: npm ci

      - name: Rejeu du seed éditorial (seed/content-update.sql)
        run: |
          npx wrangler d1 execute greenfad-production --remote --file=seed/content-update.sql
          for KEY in cache:settings cache:menus cache:footer_sections cache:redirects; do
            npx wrangler kv key delete "$KEY" --namespace-id=4d8efa4efac74c7faae30dd533f86353 2>/dev/null || true
          done
          echo "Seed éditorial appliqué et caches KV purgés."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
