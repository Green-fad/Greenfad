# GREEN FAD — Canal officiel de déploiement
# Le dépôt GitHub est la source de vérité : toute mise en production passe ici.
name: Déploiement GREEN FAD (Cloudflare Pages + D1 + R2 + KV)

on:
  push:
    branches: [main]
    paths:
      - "platform/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: greenfad-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build + Migrations D1 + Déploiement Pages
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Installation des dépendances
        run: npm ci

      - name: Vérification TypeScript (0 erreur exigée)
        run: npx tsc --noEmit

      - name: Build du bundle (_worker.js + assets)
        run: node build.mjs

      - name: Migrations D1 — production
        run: npx wrangler d1 migrations apply greenfad-production --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Seed initial — uniquement à la première installation (idempotent)
        run: |
          USERS=$(npx wrangler d1 execute greenfad-production --remote \
            --command "SELECT COUNT(*) AS n FROM users" --json \
            | jq -r 'if type=="array" then (.[0].results[0].n // 0) elif (.results?) then (.results[0].n // 0) else 0 end' 2>/dev/null || echo 0)
          if [ "$USERS" = "0" ]; then
            echo "Première installation : chargement du contenu réel…"
            npx wrangler d1 execute greenfad-production --remote --file=seed/seed.sql
          else
            echo "Base déjà initialisée ($USERS utilisateurs) — seed ignoré."
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Mise à jour du contenu éditorial (si version changée)
        run: |
          VERSION=$(npx wrangler d1 execute greenfad-production --remote \
            --command "SELECT COALESCE((SELECT value FROM settings WHERE key='content_version'),'0') AS v" --json \
            | jq -r 'if type=="array" then (.[0].results[0].v // "0") elif (.results?) then (.results[0].v // "0") else "0" end' 2>/dev/null || echo 0)
          VERSION=$(echo "$VERSION" | tr -d '"')
          if [ "$VERSION" != "13" ]; then
            echo "Contenu v13 détecté dans le dépôt (base en v$VERSION) — synchronisation du contenu réel…"
            npx wrangler d1 execute greenfad-production --remote --file=seed/content-update.sql
            for KEY in cache:settings cache:menus cache:footer_sections cache:redirects; do
              npx wrangler kv key delete "$KEY" --namespace-id=4d8efa4efac74c7faae30dd533f86353 2>/dev/null || true
            done
            echo "Contenu v13 appliqué et caches KV purgés."
          else
            echo "Contenu déjà en v13 — aucune mise à jour."
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Déploiement Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name=greenfad --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Vérification santé post-déploiement
        run: |
          sleep 15
          URL="https://greenfad.pages.dev"
          for i in 1 2 3 4 5; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL/api/v1/health" || echo "000")
            [ "$CODE" = "200" ] && echo "✅ Health check OK ($URL/api/v1/health)" && exit 0
            echo "Tentative $i : HTTP $CODE — nouvelle tentative dans 10 s…"
            sleep 10
          done
          echo "⚠️ Health check non concluant — vérifier manuellement"
          exit 1
